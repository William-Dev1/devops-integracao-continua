name: Pipeline CI

on:
  push:
    branches:
      - main
      - desenvolvimento
      - features

  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          test -f src/index.html
          test -f src/style.css
          test -f src/script.js
          test -f Dockerfile

      - name: Construir imagem Docker
        run: docker build -t devops-integracao-continua .

      - name: Executar container
        run: docker run -d -p 8080:80 --name devops-app devops-integracao-continua

      - name: Aguardar servidor
        run: sleep 5

      - name: Testar aplicacao
        run: curl --fail http://localhost:8080

      - name: Mostrar containers
        run: docker ps

      - name: Parar container
        run: docker stop devops-app